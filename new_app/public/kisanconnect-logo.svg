<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="kcBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#047857" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald leaf gradient -->
    <linearGradient id="kcLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Golden wheat gradient -->
    <linearGradient id="kcWheatGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Tech Connect ring gradient -->
    <linearGradient id="kcRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="kcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#kcBgGlow)"/>

  <!-- Tech Connect Orbit Ring (Dotted / Dashed) -->
  <circle cx="100" cy="100" r="76" stroke="url(#kcRingGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.65" stroke-linecap="round"/>

  <!-- Left: Flourishing Green Sprout Leaf -->
  <path d="M100 152 C70 148 42 124 46 88 C48 70 60 52 74 44 C72 64 80 84 94 96 C100 102 101 122 100 152 Z" 
        fill="url(#kcLeafGrad)" filter="url(#kcGlow)"/>

  <!-- Leaf Central Vein / Connection Stream -->
  <path d="M100 152 Q82 110 74 44" stroke="#ecfdf5" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Right: Golden Wheat Ear Stalk -->
  <!-- Main Stem -->
  <path d="M100 152 Q108 116 128 54" stroke="url(#kcWheatGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Wheat Grains (Right side array) -->
  <path d="M112 128 C124 126 134 116 132 106 C122 108 114 118 112 128 Z" fill="url(#kcWheatGrad)" filter="url(#kcGlow)"/>
  <path d="M118 110 C132 106 142 94 138 84 C128 86 120 98 118 110 Z" fill="url(#kcWheatGrad)" filter="url(#kcGlow)"/>
  <path d="M123 92 C138 86 146 72 140 62 C132 66 124 78 123 92 Z" fill="url(#kcWheatGrad)" filter="url(#kcGlow)"/>
  <path d="M127 74 C140 66 146 52 138 44 C132 48 126 60 127 74 Z" fill="url(#kcWheatGrad)" filter="url(#kcGlow)"/>
  <path d="M128 54 C134 44 132 34 126 30 C122 36 122 46 128 54 Z" fill="url(#kcWheatGrad)" filter="url(#kcGlow)"/>

  <!-- Wheat Awns (bristles) -->
  <path d="M132 106 L154 94" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M138 84 L162 70" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M140 62 L164 46" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M138 44 L156 26" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Intersecting Connection Nodes (Digital Network Bridge) -->
  <circle cx="100" cy="152" r="5" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
  <circle cx="74" cy="44" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="128" cy="30" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="94" cy="96" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <circle cx="118" cy="110" r="3.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>

  <!-- Connecting Node Pulses -->
  <line x1="94" y1="96" x2="118" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.85"/>
</svg>
